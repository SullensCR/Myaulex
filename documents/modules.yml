    - TransactionAnalyzer (New) # This module prints the transactions sent by the server to the client with all the transaction packet information, on top of that, the module will analyze an included pattern list (/Anticheat-Transactions.md) in the client to detect certain "patterns" in transaction IDs.
    # Example/Base of this module is provided at OpenRise `/home/dragon/IdeaProjects/Myaulex/Other-Clients/OpenRise/Client/src/main/java/com/alan/clients/module/impl/other/Debugger.java`
    # Keep in mind that in this Debugger.java file there are mentions for other debugging options such as keepalives, teleport etc. We are only interested in **Transactions**

    # When enabled it detects a world change and runs the tests and uses a Notification + throbber + Progressbar to show the progress.
    # No transactions = Vanilla/No Anticheat
    # Test takes about 3 seconds + whatever it takes to analyze

    - Notifications (Rework) # Notifications are now sent using this, including most of the notifications sent as chat messages
    # A design will be provided along with examples and designs.
    # https://www.figma.com/design/7yHHQ49DjHhoR5LUr45E3o/MyaulexAssets?node-id=4036-37
    # The notifications examples provided contain gradient colors, change the gradients depending on the notification type (types depend on the notification icon, reasoning can be made from there)
    - PacketDelay (Renamed from FakeLag)
    # Inbound and Outbound toggles, both with their set of options, currently the FakeLag module only does Outbound packet delaying (Client -> Server), Inbound would be the exact opposite (Client <- Server)
    # Both modes/toggles include a `delay` slider with a minimum of 50ms and a maximum of 1000ms with stops every 50ms
    # On top of that implement an option on both modes called "Progressive", when enabled it will start the Packet delaying like normal, but over time it will be decreasing it until its 0 and the module disables itself.
    # AutoDisables itself after a world change or disconnection
    # No packets are excluded
