modules-to-be-integrated-into-client: # This means that all these modules and ideas now go into an internal/hidden module called "Client" which work like global settings that are not overwritten by configs.
  - NoHitDelay # Default to 0, no delay
  - NoJumpDelay # Default to 0, no delay
  - NoPacketDelay (New) # The equivalent of this: https://github.com/prplz/TcpNoDelayMod
  - NoUseDelay # The No Use Delay module removes the vanilla delay when you finish eating food or drinking potions. The higher your ping, the more noticeable the effect of this module will be.
  # Allow desync abuse option:
  # If enabled, the module will skip the eating animation entirely if your current item changes while it is being consumed. An example scenario is when you press the drop item key while eating food (also known as ‘Run and eat’ glitch).
  - ClickGui # Mode and scale
  - Animations # On top of the built-in ones, copy the ones from LiquidBounce (/home/dragon/IdeaProjects/Myaulex/Other-Clients/LiquidBounce/src/main/java/net/ccbluex/liquidbounce/features/module/modules/render/Animations.kt) and OpenRise (/home/dragon/IdeaProjects/Myaulex/Other-Clients/OpenRise/Client/src/main/java/com/alan/clients/module/impl/render/Animations.java)
  - Capes # Copy and replace it with the one in "/home/dragon/IdeaProjects/Myaulex/Other-Clients/purple/build/classes/java/main/com/purple/client/module/modules/CustomCape.class"
  - Fullbright
  # Two modes:
  # Potion Effect (Generates a client side Night Vision potion effect)
  # Gamma (Already built into fullbright)
  - HUD
  # Arraylist
  # TargetHUD
  # ColorScheme
  # Watermark (Pictures redered at the center of the screen)
  - Camera Control (Renamed from NoHurtCam)
  # Contols some camera settings ranging from:
  # Damage intensity (From NoHurtCam)
  # DynamicFOV (default false, controls if the FOV is affected by potion effects and sprint status)
  # SprintControl (`client` and `game`) Controls who has control of the sprint state and FOV. This is ported and moved over from `fov-fix` from the Sprint module. Default is `client`
  - AntiObfuscate
  - Privacy # Options to hide your own name (Already implemented) and hide the Server's IP+Name (Needs reworking)
  - MoveFix (New/Migration) # In ALL modules that use MoveFix or any kind of Movement correction. (Off, Silent, Strict already built in)
  - BotFilter (New/Migration) # In ALL modules that use bot-check or similar.
  # Acts as a popular module among utility clients like these "AntiBot" which detects and filters real players from bots/npcs.
  # Modes:
  # Tablist - Checks if the player entity shows up on the tablist
  # Static - Checks if the player entity hasn't moved
  - Targets (New/Migration) # In ALL modules that have some form of target/entity filtering or order, such as Aura
  # Players, Golems, Wolves, Silverfish, Mobs, Animals
  - Teams # In ALL modules that have some sort of "Team" detection such as Aura
  # `Armor` mode: Detects your armor type and color to match you with your teammates with the same armor
  # `Tab` mode: Detects if your name in the tablist is the same as what would be considered your teammate (This might be already implemented in Aura)
  - NullMove # The Null Move module allows you to instantly switch directions when pressing multiple movement keys at once. This feature already exists for a lot of gaming keyboards (and can also be recreated using external tools), so if you are already using something like that then this module will add no real benefit. Other software may refer to the same feature as SOCD / Snap Tap / Null Binds.
  - TargetHUD
